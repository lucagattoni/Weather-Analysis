<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dublin Airport hourly weather</title>
  </head>
  <body>
    <main>
      <h1>Dublin Airport hourly weather</h1>

      <form id="controls" autocomplete="off">
        <label for="year-from">Years</label>
        <div id="year-range">
          <span class="track"></span>
          <span class="fill"></span>
          <input id="year-from" name="year-from" type="range" aria-label="First year" />
          <input id="year-to" name="year-to" type="range" aria-label="Last year" />
        </div>
        <output id="year-range-value" for="year-from year-to"></output>

        <label for="year-add">Add</label>
        <select id="year-add" name="year-add" aria-label="Add a year outside the range"></select>

        <label for="variable">Variable</label>
        <select id="variable" name="variable"></select>

        <label for="step">Detail</label>
        <input id="step" name="step" type="range" min="0" max="4" step="1" value="0" />
        <output id="step-value" for="step"></output>

        <label for="opacity">Opacity</label>
        <input id="opacity" name="opacity" type="range" min="20" max="100" step="5" value="100" />
        <output id="opacity-value" for="opacity"></output>

        <button id="reset-zoom" type="button" hidden>Reset zoom</button>
      </form>

      <p id="year-chips" aria-label="Years added outside the range"></p>

      <p id="status" role="status"></p>

      <div id="chart"></div>

      <footer>
        Data: Met &Eacute;ireann, Dublin Airport hourly observations,
        <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
