name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs to mint an id-token for the Pages deployment, and write
# to Pages. Nothing here needs write access to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing:
# a cancelled deploy can leave the site on a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      # `npm run build` runs tsc before vite build, so a type error fails the
      # deploy rather than shipping a broken bundle.
      - name: Build
        run: npm run build

      # The 81 committed year chunks are part of the site, about 37 MB.
      - name: Report what is being published
        run: du -sh dist && find dist -name '*.json' | wc -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
